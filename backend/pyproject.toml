[project]
name = "modemap-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # line length handled by formatter
  "B008",  # FastAPI uses Query()/Depends()
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "cache: cache layer tests (cache key and redis get/set)",
  "recommend_cache: /recommend caching integration tests",
  "provider: external provider/client tests (Google Places, etc.)",
  "schemas: pydantic schema validation and conversions",
  "smoke: very fast smoke tests",
  "rate_limit: slowapi rate limiting tests",
  "retry: provider retry/backoff tests",
]
